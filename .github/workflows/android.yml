name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Scripted edits can re-apply and leave a file importing the same name
      # twice, which costs a whole build cycle to find out about.
      - name: Reject duplicated imports
        run: |
          status=0
          for file in $(find app/src -name '*.kt'); do
            dups=$(grep '^import ' "$file" | sort | uniq -d)
            if [ -n "$dups" ]; then
              echo "$file"
              echo "$dups" | sed 's/^/  /'
              status=1
            fi
          done
          exit $status

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      # Gradle prints only the first failure; the report lists them all.
      - name: Print lint report
        if: failure()
        run: >
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # A release asset has a stable public URL, so installing on a phone is one
      # tap instead of a login, a zip and a file manager.
      - name: Publish the debug APK as a release
        if: success() && github.ref_name == 'claude/android-messaging-app-atmauj'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Debug build
          body: Debug APK built from ${{ github.sha }}. Sideload only.
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
          if-no-files-found: ignore
